<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ilustrácia kancelárskeho počítača s monitorom">
  <defs>
    <linearGradient id="kg-case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="kg-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f4ff"/>
      <stop offset="1" stop-color="#cfe6ff"/>
    </linearGradient>
    <linearGradient id="kg-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e8fb"/>
      <stop offset="1" stop-color="#007bff"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="274" rx="132" ry="13" fill="#0b1220" opacity="0.07"/>

  <!-- monitor -->
  <rect x="86" y="34" width="212" height="140" rx="10" fill="#0f172a"/>
  <rect x="94" y="42" width="196" height="118" rx="5" fill="url(#kg-screen)"/>

  <!-- obsah obrazovky -->
  <g fill="#0084ff" opacity="0.28">
    <rect x="108" y="58" width="72" height="8" rx="4"/>
    <rect x="108" y="76" width="140" height="6" rx="3"/>
    <rect x="108" y="90" width="118" height="6" rx="3"/>
    <rect x="108" y="104" width="132" height="6" rx="3"/>
  </g>
  <g fill="#22c55e" opacity="0.75">
    <rect x="108" y="126" width="46" height="18" rx="6"/>
  </g>
  <rect x="164" y="126" width="46" height="18" rx="6" fill="#0084ff" opacity="0.28"/>

  <!-- stojan -->
  <rect x="180" y="174" width="24" height="26" fill="#cbd5e1"/>
  <rect x="150" y="200" width="84" height="9" rx="4.5" fill="#94a3b8"/>

  <!-- skrinka (malý formát, naležato) -->
  <rect x="248" y="206" width="112" height="46" rx="8" fill="url(#kg-case)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="248" y="206" width="8" height="46" rx="4" fill="url(#kg-accent)"/>
  <circle cx="344" cy="215" r="4" fill="#22c55e"/>
  <g fill="#cbd5e1">
    <rect x="272" y="228" width="34" height="5" rx="2.5"/>
    <rect x="272" y="238" width="22" height="5" rx="2.5"/>
  </g>
  <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="316" y="230" width="12" height="10" rx="2"/>
    <rect x="332" y="230" width="12" height="10" rx="2"/>
  </g>

  <!-- klávesnica -->
  <rect x="60" y="222" width="150" height="34" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#cbd5e1">
    <rect x="72" y="232" width="14" height="6" rx="2"/>
    <rect x="92" y="232" width="14" height="6" rx="2"/>
    <rect x="112" y="232" width="14" height="6" rx="2"/>
    <rect x="132" y="232" width="14" height="6" rx="2"/>
    <rect x="152" y="232" width="14" height="6" rx="2"/>
    <rect x="172" y="232" width="14" height="6" rx="2"/>
    <rect x="88" y="244" width="94" height="6" rx="3"/>
  </g>
</svg>
