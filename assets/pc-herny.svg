<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ilustrácia herného počítača">
  <defs>
    <linearGradient id="hg-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hg-rgb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e8fb"/>
      <stop offset="1" stop-color="#007bff"/>
    </linearGradient>
    <radialGradient id="hg-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e8fb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00e8fb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="272" rx="118" ry="14" fill="#0b1220" opacity="0.07"/>
  <ellipse cx="188" cy="150" rx="130" ry="130" fill="url(#hg-glow)" opacity="0.5"/>

  <!-- skrinka -->
  <rect x="104" y="36" width="168" height="228" rx="14" fill="url(#hg-glass)"/>
  <rect x="104" y="36" width="168" height="228" rx="14" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- sklenený bok -->
  <rect x="118" y="50" width="122" height="200" rx="8" fill="#0b1220" opacity="0.75"/>
  <rect x="118" y="50" width="122" height="200" rx="8" fill="none" stroke="#3f5473" stroke-width="2"/>

  <!-- ventilátory -->
  <g stroke="url(#hg-rgb)" stroke-width="4" fill="none">
    <circle cx="150" cy="86" r="20"/>
    <circle cx="150" cy="140" r="20"/>
    <circle cx="150" cy="194" r="20"/>
  </g>
  <g fill="#00e8fb" opacity="0.9">
    <circle cx="150" cy="86" r="4"/>
    <circle cx="150" cy="140" r="4"/>
    <circle cx="150" cy="194" r="4"/>
  </g>

  <!-- grafická karta -->
  <rect x="182" y="128" width="52" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="186" y="133" width="30" height="4" rx="2" fill="url(#hg-rgb)"/>

  <!-- chladič procesora -->
  <rect x="182" y="72" width="52" height="40" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="2">
    <line x1="190" y1="80" x2="190" y2="104"/>
    <line x1="199" y1="80" x2="199" y2="104"/>
    <line x1="208" y1="80" x2="208" y2="104"/>
    <line x1="217" y1="80" x2="217" y2="104"/>
    <line x1="226" y1="80" x2="226" y2="104"/>
  </g>

  <!-- RAM moduly -->
  <g fill="url(#hg-rgb)">
    <rect x="186" y="160" width="6" height="46" rx="3"/>
    <rect x="198" y="160" width="6" height="46" rx="3"/>
  </g>

  <!-- predný pásik a tlačidlo -->
  <rect x="252" y="52" width="8" height="130" rx="4" fill="url(#hg-rgb)"/>
  <circle cx="256" cy="238" r="6" fill="#22c55e"/>
</svg>
